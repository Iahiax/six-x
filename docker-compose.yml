version: '3.8'

services:
  capital-ai-x:
    build: .
    container_name: capital_ai_x_engine
    restart: always
    env_file:
      - .env
    ports:
      - "8501:8501"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
